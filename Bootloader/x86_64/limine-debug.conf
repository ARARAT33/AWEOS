# CI-only boot configuration. Normal releases continue to use limine.conf.
serial: yes
serial_baudrate: 115200
verbose: yes
timeout: 3

/AWEOS Live Desktop (diagnostic)
    protocol: linux
    kernel_path: boot():/boot/bzImage
    module_path: boot():/boot/aweos-initramfs.cpio.gz
    cmdline: aweos.mode=aweui console=tty0 console=ttyS0,115200n8 earlycon=uart8250,io,0x3f8,115200 loglevel=7 ignore_loglevel

/AWEOS Installer (diagnostic)
    protocol: linux
    kernel_path: boot():/boot/bzImage
    module_path: boot():/boot/aweos-initramfs.cpio.gz
    cmdline: aweos.mode=installer console=tty0 console=ttyS0,115200n8 earlycon=uart8250,io,0x3f8,115200 loglevel=7 ignore_loglevel
