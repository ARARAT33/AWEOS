serial: yes
verbose: yes
timeout: 3

/AWEOS Live Desktop (CI diagnostics)
    protocol: linux
    kernel_path: boot():/boot/bzImage
    module_path: boot():/boot/aweos-initramfs.cpio.gz
    cmdline: aweos.mode=aweui console=tty0 console=ttyS0,115200n8 loglevel=7 ignore_loglevel earlycon=uart8250,io,0x3f8,115200 scsi_mod.scan=sync

/AWEOS Installer (CI diagnostics)
    protocol: linux
    kernel_path: boot():/boot/bzImage
    module_path: boot():/boot/aweos-initramfs.cpio.gz
    cmdline: aweos.mode=installer console=tty0 console=ttyS0,115200n8 loglevel=7 ignore_loglevel earlycon=uart8250,io,0x3f8,115200 scsi_mod.scan=sync
