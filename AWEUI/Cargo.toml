[package]
name = "aweui"
version = "0.1.0"
edition = "2021"

[dependencies]
smithay = { version = "0.3", default-features = false, features = ["input", "renderer_gl", "wayland_frontend", "backend_winit"] }
wayland-server = "0.31"
wayland-protocols = { version = "0.31", features = ["staging", "unstable", "client", "server"] }
calloop = "0.13"
xkbcommon = "0.7"
nix = { version = "0.27", features = ["mman", "signal", "fs", "process", "socket"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
lazy_static = "1.4"
