name: AWEOS Linux Kernel Sync

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout AWEOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "AWEOS Linux Sync Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official Linux upstream
        run: |
          set -euo pipefail
          git remote remove linux-upstream 2>/dev/null || true
          git remote add linux-upstream https://github.com/torvalds/linux.git
          git fetch --no-tags linux-upstream master

      - name: Initialize or safely synchronize /linux
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f linux/Makefile ]]; then
            echo "Initial migration: moving the complete Linux fork into /linux."
            test -f Makefile
            test -f Kconfig
            test -d kernel
            test -d arch

            mkdir -p linux
            while IFS= read -r -d '' path; do
              git mv -- "$path" "linux/$path"
            done < <(git ls-tree -z --name-only HEAD)

            mkdir -p .github/workflows
            cat > .github/workflows/aweos-linux-sync.yml <<'YAML'
name: AWEOS Linux Kernel Sync
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout AWEOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configure Git
        run: |
          git config user.name "AWEOS Linux Sync Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch official Linux upstream
        run: |
          git remote remove linux-upstream 2>/dev/null || true
          git remote add linux-upstream https://github.com/torvalds/linux.git
          git fetch --no-tags linux-upstream master
      - name: Safe Linux synchronization
        shell: bash
        run: |
          set -euo pipefail
          test -f linux/Makefile
          test -f linux/Kconfig
          test -d linux/kernel
          test -d linux/arch
          if [[ -n "$(git status --porcelain -- linux)" ]]; then
            echo "ERROR: /linux contains local changes; update aborted."
            git status --short -- linux
            exit 1
          fi
          CURRENT_TREE="$(git rev-parse HEAD:linux)"
          UPSTREAM_TREE="$(git rev-parse linux-upstream/master^{tree})"
          UPSTREAM_SHA="$(git rev-parse linux-upstream/master)"
          if [[ "$CURRENT_TREE" == "$UPSTREAM_TREE" ]]; then
            echo "Already synchronized with torvalds/linux: $UPSTREAM_SHA"
            exit 0
          fi
          git rm -r --quiet linux
          git read-tree --prefix=linux/ -u linux-upstream/master
          test -f linux/Makefile
          test -f linux/Kconfig
          test -d linux/kernel
          test -d linux/arch
          git add -A
          git commit -m "Sync Linux kernel to $UPSTREAM_SHA"
          git push origin HEAD:master
