name: AWEOS x86_64 Build, Image and Boot Tests

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-aweos-x86_64.yml'
      - 'AWEUI/**'
      - 'APPS/**'
      - 'Bootloader/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Makefile'
      - 'limine.conf'
  pull_request:
    paths:
      - '.github/workflows/build-aweos-x86_64.yml'
      - 'AWEUI/**'
      - 'APPS/**'
      - 'Bootloader/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Makefile'
      - 'limine.conf'

permissions:
  contents: read

jobs:
  build-and-boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout AWEOS
        uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y             build-essential bc bison flex libssl-dev libelf-dev cpio gzip xz-utils             curl xorriso qemu-system-x86 ovmf busybox-static util-linux e2fsprogs             parted netcat-openbsd pkg-config git patch autoconf automake libtool nasm mtools lld

      - name: Build Limine host utility
        run: |
          set -euo pipefail
          rm -rf /tmp/limine
          git clone --depth 1 --branch v12.6.1 https://github.com/Limine-Bootloader/Limine.git /tmp/limine
          cd /tmp/limine
          ./bootstrap
          ./configure --enable-bios --enable-uefi-x86-64
          make -j"$(nproc)"
          test -x bin/limine
          sudo install -m 0755 bin/limine /usr/local/bin/limine

      - name: Verify /linux is untouched
        run: ./scripts/verify-linux-readonly.sh

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build AWEOS images
        run: make image

      - name: Verify /linux after build
        run: ./scripts/verify-linux-readonly.sh

      - name: Boot-test BIOS and UEFI ISO
        run: make test-qemu

      - name: Verify /linux after QEMU tests
        run: ./scripts/verify-linux-readonly.sh

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          sha256sum             build/AWEOS-x86_64.iso             build/AWEOS-x86_64-disk.img             build/aweos-initramfs.cpio.gz             build/rootfs.img             build/linux-x86_64/arch/x86/boot/bzImage             > build/aweos-sha256sums.txt
          test -s build/aweos-sha256sums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AWEOS-x86_64-release
          path: |
            build/AWEOS-x86_64.iso
            build/AWEOS-x86_64-disk.img
            build/rootfs.img
            build/aweos-initramfs.cpio.gz
            build/linux-x86_64/arch/x86/boot/bzImage
            build/aweos-sha256sums.txt
