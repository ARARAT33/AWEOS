name: AWEOS x86_64 Build, Image and Boot Tests

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-aweos-x86_64.yml'
      - 'AWEUI/**'
      - 'APPS/**'
      - 'Bootloader/**'
      - 'scripts/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Makefile'
      - 'limine.conf'
  pull_request:
    paths:
      - '.github/workflows/build-aweos-x86_64.yml'
      - 'AWEUI/**'
      - 'APPS/**'
      - 'Bootloader/**'
      - 'scripts/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Makefile'
      - 'limine.conf'

permissions:
  contents: read

jobs:
  build-and-boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout AWEOS
        uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev libinput-dev libxkbcommon-dev cpio gzip xz-utils \
            curl xorriso qemu-system-x86 ovmf busybox-static util-linux e2fsprogs \
            parted netcat-openbsd pkg-config git patch autoconf automake libtool nasm mtools lld \
            llvm debootstrap rsync

      - name: Build Limine host utility
        run: |
          set -euo pipefail
          rm -rf /tmp/limine
          git clone --depth 1 --branch v12.6.1 https://github.com/Limine-Bootloader/Limine.git /tmp/limine
          cd /tmp/limine
          ./bootstrap
          OBJDUMP_FOR_TARGET=objdump \
            LD_FOR_TARGET=ld \
            OBJCOPY_FOR_TARGET=objcopy \
            ./configure --enable-bios --enable-uefi-x86-64
          make -j"$(nproc)"
          test -x bin/limine
          sudo install -m 0755 bin/limine /usr/local/bin/limine

      - name: Verify /linux is untouched
        run: ./scripts/verify-linux-readonly.sh

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Run shell and rootfs regression tests
        run: make test-shell

      - name: Build AWEOS images
        id: image_build
        run: |
          set -o pipefail
          AWEOS_LIMINE_CONFIG=Bootloader/x86_64/limine-ci.conf make image 2>&1 | tee build-make-image.log

      - name: Publish make-image failure diagnostics
        if: failure()
        run: |
          echo '## make image failure tail' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build-make-image.log ]; then
            tail -n 300 build-make-image.log >> "$GITHUB_STEP_SUMMARY"
            # Emit the concrete failing output as run-page error annotations so the
            # failure is readable without an authenticated log session.
            grep -nE 'ERROR:|Error [0-9]+|FAILURE|No such file|Permission denied|not found' build-make-image.log | tail -n 8 | cut -c1-400 > /tmp/aweos-errors.txt
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo "::error::$line"
            done < /tmp/aweos-errors.txt
          else
            echo 'build-make-image.log not found' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify /linux after build
        id: linux_after_build
        run: ./scripts/verify-linux-readonly.sh

      - name: Boot-test BIOS ISO
        id: qemu_bios
        if: always() && steps.image_build.outcome == 'success' && steps.linux_after_build.outcome == 'success'
        run: bash ./scripts/run-qemu-tests.sh build bios

      - name: Boot-test UEFI ISO
        id: qemu_uefi
        if: always() && steps.image_build.outcome == 'success' && steps.linux_after_build.outcome == 'success'
        run: bash ./scripts/run-qemu-tests.sh build uefi

      - name: Retry BIOS with a bounded instruction and interrupt trace
        if: failure() && steps.qemu_bios.outcome == 'failure'
        env:
          AWEOS_QEMU_DEBUG_FLAGS: in_asm,int,guest_errors,cpu_reset
          AWEOS_QEMU_DFILTER: "0x3c00000..0x3d00000"
          AWEOS_QEMU_TIMEOUT_SECONDS: '15'
        run: |
          set -euo pipefail
          # Preserve the original low-volume trace before the retry overwrites it.
          if [ -f build/qemu-bios.log ]; then
            cp build/qemu-bios.log build/qemu-bios-initial.log
          fi
          if [ -f build/qemu-bios-debug.log ]; then
            cp build/qemu-bios-debug.log build/qemu-bios-initial-debug.log
          fi

          # Keep the diagnostic artifact bounded even if the guest begins
          # generating a high volume of interrupt trace records.
          ulimit -f 65536
          set +e
          bash scripts/run-qemu-tests.sh build bios > build/qemu-bios-interrupt-retry.log 2>&1
          retry_status=$?
          set -e
          echo "BIOS instruction/interrupt-trace retry exit status: $retry_status" >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 build/qemu-bios-interrupt-retry.log >> "$GITHUB_STEP_SUMMARY" || true
          if [ -s build/qemu-bios-debug.log ]; then
            echo "## BIOS filtered instruction/interrupt trace tail" >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 build/qemu-bios-debug.log >> "$GITHUB_STEP_SUMMARY"
          fi
          # This is diagnostic-only. The original QEMU step remains failed.
          exit 0

      - name: Publish QEMU boot failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          for mode in bios uefi; do
            logfile="build/qemu-$mode.log"
            debuglog="build/qemu-$mode-debug.log"
            if [ -s "$logfile" ]; then
              echo "## QEMU $mode serial log (last 200 lines)" >> "$GITHUB_STEP_SUMMARY"
              tail -n 200 "$logfile" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No QEMU $mode serial output was captured." >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -s "$debuglog" ]; then
              echo "## QEMU $mode emulator debug trace (last 200 lines)" >> "$GITHUB_STEP_SUMMARY"
              tail -n 200 "$debuglog" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No QEMU $mode emulator debug trace was produced." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload build and QEMU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aweos-build-and-boot-diagnostics
          path: |
            build-make-image.log
            build/qemu-bios.log
            build/qemu-uefi.log
            build/qemu-bios-debug.log
            build/qemu-uefi-debug.log
            build/qemu-bios-initial.log
            build/qemu-bios-initial-debug.log
            build/qemu-bios-interrupt-retry.log
          if-no-files-found: ignore

      - name: Verify /linux after QEMU tests
        if: always()
        run: ./scripts/verify-linux-readonly.sh

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          sha256sum \
            build/AWEOS-x86_64.iso \
            build/AWEOS-x86_64-disk.img \
            build/aweos-initramfs.cpio.gz \
            build/rootfs.img \
            build/linux-x86_64/arch/x86/boot/bzImage \
            > build/aweos-sha256sums.txt
          test -s build/aweos-sha256sums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AWEOS-x86_64-release
          path: |
            build/AWEOS-x86_64.iso
            build/AWEOS-x86_64-disk.img
            build/rootfs.img
            build/aweos-initramfs.cpio.gz
            build/linux-x86_64/arch/x86/boot/bzImage
            build/aweos-sha256sums.txt
