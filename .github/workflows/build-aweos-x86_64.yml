name: AWEOS x86_64 Boot Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-aweos-x86_64.yml'
      - 'Bootloader/**'
      - 'scripts/**'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/workflows/build-aweos-x86_64.yml'
      - 'Bootloader/**'
      - 'scripts/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout AWEOS
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev cpio gzip xz-utils curl xorriso qemu-system-x86 ovmf busybox-static util-linux e2fsprogs parted

      - name: Verify /linux source integrity (Pre-build)
        run: |
          set -eu
          ./scripts/verify-linux-readonly.sh
          git ls-files -s linux | sha256sum > build-linux-before.sha256

      - name: Build AWEOS Bootable ISO & Raw Disk Images
        run: |
          set -eu
          make build

      - name: Verify /linux source integrity (Post-build)
        run: |
          set -eu
          ./scripts/verify-linux-readonly.sh
          git ls-files -s linux | sha256sum > build-linux-after.sha256
          cmp build-linux-before.sha256 build-linux-after.sha256

      - name: Run QEMU BIOS and UEFI Boot Verification
        run: |
          set -eu
          make test

      - name: Verify /linux source integrity (Post-test)
        run: |
          set -eu
          ./scripts/verify-linux-readonly.sh
          git ls-files -s linux | sha256sum > build-linux-final.sha256
          cmp build-linux-before.sha256 build-linux-final.sha256

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AWEOS-x86_64-verified
          path: |
            build/AWEOS-x86_64.iso
            build/AWEOS-x86_64-disk.img
            build/linux-x86_64/arch/x86/boot/bzImage
            build/qemu-bios.log
            build/qemu-uefi.log
          if-no-files-found: error
