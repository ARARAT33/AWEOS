name: AWEOS x86_64 Build, Image and Boot Tests

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-aweos-x86_64.yml'
      - 'AWEUI/**'
      - 'APPS/**'
      - 'Bootloader/**'
      - 'scripts/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Makefile'
      - 'limine.conf'
  pull_request:
    paths:
      - '.github/workflows/build-aweos-x86_64.yml'
      - 'AWEUI/**'
      - 'APPS/**'
      - 'Bootloader/**'
      - 'scripts/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Makefile'
      - 'limine.conf'

permissions:
  contents: read

jobs:
  build-and-boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWEOS_LIMINE_CONFIG: Bootloader/x86_64/limine-debug.conf
    steps:
      - name: Checkout AWEOS
        uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev linux-libc-dev libinput-dev libxkbcommon-dev musl-tools cpio gzip xz-utils \
            curl xorriso qemu-system-x86 ovmf util-linux e2fsprogs \
            parted netcat-openbsd pkg-config git patch autoconf automake libtool nasm mtools lld \
            llvm debootstrap rsync

      - name: Build Limine host utility
        run: |
          set -euo pipefail
          rm -rf /tmp/limine
          git clone --depth 1 --branch v12.6.1 https://github.com/Limine-Bootloader/Limine.git /tmp/limine
          cd /tmp/limine
          ./bootstrap
          OBJDUMP_FOR_TARGET=objdump \
            LD_FOR_TARGET=ld \
            OBJCOPY_FOR_TARGET=objcopy \
            ./configure --enable-bios --enable-uefi-x86-64
          make -j"$(nproc)"
          test -x bin/limine
          sudo install -m 0755 bin/limine /usr/local/bin/limine

      - name: Run shell, C, rootfs, session, and QEMU-runner regressions
        run: make test-shell

      - name: Verify /linux is untouched
        run: ./scripts/verify-linux-readonly.sh

      - name: Test Rust workspace
        run: cargo test --workspace


      - name: Build AWEOS images
        id: build_images
        run: |
          set -o pipefail
          make image 2>&1 | tee image-build.log

      - name: Publish image-build failure diagnostics
        if: ${{ failure() && steps.build_images.outcome == 'failure' }}
        run: |
          set -uo pipefail
          mkdir -p build
          summary="build/image-build-failure-summary.txt"
          : > "$summary"
          {
            echo "AWEOS image build failure diagnostics"
            echo
            echo "First make/script errors:"
            grep -nE 'ERROR:|Error [0-9]+|\*\*\*' image-build.log | head -n 40 || true
            echo
            echo "Last 100 log lines:"
            tail -n 100 image-build.log || true
          } | tee -a "$summary"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
          excerpt="$(grep -m1 -E 'ERROR:|\*\*\*' image-build.log | cut -c1-700 || true)"
          if [ -n "${excerpt:-}" ]; then
            echo "::error::AWEOS image build failed: ${excerpt}"
          fi

      - name: Upload image build log on failure
        if: ${{ failure() && steps.build_images.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: AWEOS-image-build-log
          path: image-build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify /linux after build
        run: ./scripts/verify-linux-readonly.sh

      - name: Preserve ISO for boot-test diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AWEOS-boot-test-input
          path: build/AWEOS-x86_64.iso
          if-no-files-found: error
          retention-days: 7

      - name: Boot-test BIOS, UEFI and direct kernel
        id: qemu_boot
        env:
          AWEOS_QEMU_CPU: qemu64
        run: make test-qemu

      - name: Boot diagnostic retry with qemu64 targeted instruction trace
        if: ${{ failure() && steps.qemu_boot.outcome == 'failure' }}
        continue-on-error: true
        env:
          AWEOS_QEMU_CPU: qemu64
          AWEOS_QEMU_LOG_SUFFIX: instrtrace
          AWEOS_QEMU_DEBUG_FLAGS: in_asm,int,guest_errors,cpu_reset
          # QEMU -dfilter accepts comma-separated ranges. Capture the
          # userspace #UD at 0x56df50 and the earlier compressed-kernel region.
          AWEOS_QEMU_DFILTER: 0x500000..0x600000,0x3c00000..0x45d0000
        run: |
          for log in build/qemu-*.log; do
            if [ -f "$log" ] && grep -q "AWEOS RECOVERY SHELL READY" "$log"; then
              echo "Skipping qemu64 instruction-trace retry: the guest reached its recovery console; this is a userspace/desktop failure, not an early CPU fault."
              exit 0
            fi
          done
          bash ./scripts/run-qemu-tests.sh build all

      - name: Summarize the qemu64 faulting instruction from the tagged trace
        if: ${{ failure() && steps.qemu_boot.outcome == 'failure' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          summary="build/qemu64-instrtrace-summary.txt"
          mkdir -p build
          : > "$summary"
          found=0
          for log in build/qemu-*-instrtrace-debug.log; do
            if [ -f "$log" ]; then
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No tagged qemu64 instruction-trace debug logs were produced (either the trace retry was skipped because the guest reached its recovery console, or the retry did not run)."
            echo "No tagged qemu64 instruction-trace debug logs were produced." >> "$summary"
          else
            for log in build/qemu-*-instrtrace-debug.log; do
              {
                echo
                bash ./scripts/extract-qemu-instrtrace.sh "$log"
              } | tee -a "$summary"
            done
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
          excerpt="$(grep -m1 -E 'v=0[68d]|0x[0-9a-f]+: ' "$summary" | cut -c1-700 || true)"
          if [ -n "${excerpt:-}" ]; then
            echo "::error::qemu64 instruction-trace summary: ${excerpt}"
          fi

      - name: Upload qemu64 instruction-trace summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AWEOS-qemu64-instrtrace-summary
          path: build/qemu64-instrtrace-summary.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Boot diagnostic retry with QEMU max CPU and instruction trace
        if: ${{ failure() && steps.qemu_boot.outcome == 'failure' }}
        continue-on-error: true
        env:
          AWEOS_QEMU_CPU: max
          AWEOS_QEMU_DEBUG_FLAGS: int,guest_errors,cpu_reset,in_asm
        run: |
          for log in build/qemu-*.log; do
            if [ -f "$log" ] && grep -q "AWEOS RECOVERY SHELL READY" "$log"; then
              echo "Skipping CPU/instruction retry: the guest reached its recovery console; this is a userspace/desktop failure, not an early CPU fault."
              exit 0
            fi
          done
          bash ./scripts/run-qemu-tests.sh build all

      - name: Upload QEMU and kernel diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AWEOS-QEMU-diagnostics
          path: |
            build/qemu-*.log
            build/AWEOS-x86_64.iso
            build/linux-x86_64/vmlinux
            build/linux-x86_64/System.map
            build/linux-x86_64/.config
            build/linux-x86_64/arch/x86/boot/bzImage
            build/linux-x86_64/arch/x86/boot/compressed/vmlinux
            build/aweos-initramfs.cpio.gz
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Verify /linux after QEMU tests
        if: always()
        run: ./scripts/verify-linux-readonly.sh

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          sha256sum \
            build/AWEOS-x86_64.iso \
            build/AWEOS-x86_64-disk.img \
            build/aweos-initramfs.cpio.gz \
            build/rootfs.img \
            build/linux-x86_64/arch/x86/boot/bzImage \
            > build/aweos-sha256sums.txt
          test -s build/aweos-sha256sums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AWEOS-x86_64-release
          path: |
            build/AWEOS-x86_64.iso
            build/AWEOS-x86_64-disk.img
            build/rootfs.img
            build/aweos-initramfs.cpio.gz
            build/linux-x86_64/arch/x86/boot/bzImage
            build/aweos-sha256sums.txt
