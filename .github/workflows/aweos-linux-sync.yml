name: AWEOS Linux Kernel Sync

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aweos-linux-sync
  cancel-in-progress: false

jobs:
  sync-linux-only:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout AWEOS
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          set -euo pipefail
          git config user.name "AWEOS Linux Sync Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official Linux upstream
        run: |
          set -euo pipefail
          git remote add linux-upstream https://github.com/torvalds/linux.git
          git fetch --no-tags linux-upstream master

      - name: Verify AWEOS repository is clean
        run: |
          set -euo pipefail
          test -d linux
          test -f linux/Makefile
          test -f linux/Kconfig
          test -d linux/kernel
          test -d linux/arch
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "ERROR: Working tree is not clean. Aborting safely; nothing will be pushed."
            git status --short
            exit 1
          fi

      - name: Compare ONLY /linux with torvalds/linux
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          current_tree="$(git rev-parse HEAD:linux)"
          upstream_tree="$(git rev-parse linux-upstream/master^{tree})"
          upstream_sha="$(git rev-parse linux-upstream/master)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if [[ "$current_tree" == "$upstream_tree" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "/linux already exactly matches torvalds/linux: $upstream_sha"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "/linux differs from torvalds/linux and will be synchronized."
          fi

      - name: Update ONLY /linux
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # HARD BOUNDARY: this workflow is allowed to change /linux only.
          git rm -r --quiet -- linux
          git read-tree --prefix=linux/ -u linux-upstream/master

          # Exact upstream-tree verification.
          test -f linux/Makefile
          test -f linux/Kconfig
          test -d linux/kernel
          test -d linux/arch
          test "$(git rev-parse :linux)" = "$(git rev-parse linux-upstream/master^{tree})"

      - name: Verify NOTHING outside /linux changed
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          outside="$(git diff --cached --name-only -- . ':(exclude)linux/**')"
          if [[ -n "$outside" ]]; then
            echo "ERROR: Change detected outside /linux. Aborting without commit or push."
            printf '%s\n' "$outside"
            git reset --hard HEAD
            exit 1
          fi
          echo "SAFE: all staged changes are inside /linux only."

      - name: Commit and push Linux update
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git commit -m "Sync /linux with torvalds/linux ${{ steps.compare.outputs.upstream_sha }}"
          git push origin HEAD:master

      - name: Already synchronized
        if: steps.compare.outputs.changed == 'false'
        run: echo "No update required."