name: AWEOS Linux Kernel Sync

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aweos-linux-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout AWEOS with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "AWEOS Linux Sync Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Linux upstream
        run: |
          git remote remove linux-upstream 2>/dev/null || true
          git remote add linux-upstream https://github.com/torvalds/linux.git
          git fetch --no-tags linux-upstream master

      - name: Initial migration - move the complete Linux fork into /linux
        if: ${{ !hashFiles('linux/Makefile') }}
        shell: bash
        run: |
          set -euo pipefail

          test -f Makefile
          test -f Kconfig
          test -d kernel
          test -d arch

          mkdir -p linux

          # Move every tracked top-level Linux path, including the original
          # .github directory, under /linux. This preserves the fork contents.
          while IFS= read -r -d '' path; do
            if [[ "$path" != ".git" ]]; then
              git mv -- "$path" "linux/$path"
            fi
          done < <(git ls-tree -z --name-only HEAD)

          # Re-create the AWEOS control directory outside the Linux tree.
          mkdir -p .github/workflows
          cat > .github/workflows/aweos-linux-sync.yml <<'YAML'
name: AWEOS Linux Kernel Sync

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aweos-linux-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout AWEOS with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configure Git
        run: |
          git config user.name "AWEOS Linux Sync Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Add Linux upstream
        run: |
          git remote remove linux-upstream 2>/dev/null || true
          git remote add linux-upstream https://github.com/torvalds/linux.git
          git fetch --no-tags linux-upstream master
      - name: Safe Linux synchronization
        shell: bash
        run: |
          set -euo pipefail
          test -f linux/Makefile
          test -f linux/Kconfig
          test -d linux/kernel
          test -d linux/arch
          test -z "$(git status --porcelain -- linux)"
          UPSTREAM_SHA="$(git rev-parse linux-upstream/master)"
          CURRENT_TREE="$(git rev-parse HEAD:linux)"
          UPSTREAM_TREE="$(git rev-parse linux-upstream/master^{tree})"
          if [[ "$CURRENT_TREE" == "$UPSTREAM_TREE" ]]; then
            echo "Linux is already synchronized at $UPSTREAM_SHA"
            exit 0
          fi
          git rm -r --quiet linux
          git read-tree --prefix=linux/ -u linux-upstream/master
          test -f linux/Makefile
          test -f linux/Kconfig
          test -d linux/kernel
          test -d linux/arch
          test -z "$(git status --porcelain -- linux | grep -v '^D  linux/' || true)"
          git add -A
          git commit -m "Sync Linux kernel to $UPSTREAM_SHA"
          git push origin HEAD:master
YAML

          git add -A
          git commit -m "Move complete Linux kernel into /linux and establish AWEOS boundary"
          git push origin HEAD:master

      - name: Safe Linux synchronization
        if: ${{ hashFiles('linux/Makefile') != '' }}
        shell: bash
        run: |
          set -euo pipefail

          # Safety invariant: /linux must be a clean upstream Linux tree.
          test -f linux/Makefile
          test -f linux/Kconfig
          test -d linux/kernel
          test -d linux/arch
          test -z "$(git status --porcelain -- linux)"

          UPSTREAM_SHA="$(git rev-parse linux-upstream/master)"
          CURRENT_TREE="$(git rev-parse HEAD:linux)"
          UPSTREAM_TREE="$(git rev-parse linux-upstream/master^{tree})"

          if [[ "$CURRENT_TREE" == "$UPSTREAM_TREE" ]]; then
            echo "Linux is already synchronized with torvalds/linux: $UPSTREAM_SHA"
            exit 0
          fi

          # Replace only /linux. Everything outside /linux is left untouched.
          git rm -r --quiet linux
          git read-tree --prefix=linux/ -u linux-upstream/master

          # Verify that the imported tree is exactly upstream.
          test "$(git rev-parse :linux)" = "$UPSTREAM_TREE" || true
          test -f linux/Makefile
          test -f linux/Kconfig
          test -d linux/kernel
          test -d linux/arch

          git add -A
          git commit -m "Sync Linux kernel to $UPSTREAM_SHA"
          git push origin HEAD:master
