name: Validate AWEOS Userland

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate-userland.yml'
      - 'AWEUI/**'
      - 'APPS/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/workflows/validate-userland.yml'
      - 'AWEUI/**'
      - 'APPS/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Makefile'

permissions:
  contents: read

jobs:
  userland:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install native Rust UI dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libinput-dev libxkbcommon-dev

      - name: Run shell and rootfs runtime regression tests
        run: make test-shell

      - name: Validate repository boundary
        run: |
          set -euo pipefail
          ./scripts/verify-linux-readonly.sh

      - name: Run Cargo metadata validation
        run: cargo metadata --no-deps --format-version 1 >/dev/null

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Build all Rust userland binaries
        run: cargo build --workspace --release

      - name: Verify expected binaries
        run: |
          set -euo pipefail
          for binary in aweui aweui-installer aweui-settings aweui-control-center aweui-file-manager aweui-terminal aweui-system-monitor aweui-diagnostics aweui-text-editor aweui-calculator aweui-firstboot-setup aweui-user-app-template; do
            test -x "target/release/${binary}"
          done
